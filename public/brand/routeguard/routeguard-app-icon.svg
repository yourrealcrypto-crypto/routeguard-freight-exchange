    <circle cx="82" cy="184" r="10.5"></circle>
    <circle cx="126" cy="184" r="10.5"></circle>
    <circle cx="170" cy="184" r="10.5"></circle>
  </g>
  <g id="routeguard-verified-route" fill="#0A9F4D">
