<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501 328" width="501" height="328" role="img" aria-labelledby="t d">
  <title id="t">RouteGuard symbol — small optical size</title>
  <desc id="d">Optical-size symbol for 16-48 px: gateway, origin node, two waypoints, verification checkmark and short verified exit. Separate asset; the standard symbol is unchanged.</desc>
